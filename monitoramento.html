<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoramento Diário - AbraçaMente</title>


<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<link
rel="shortcut icon"
href="image/Abracamente.png"
type="image/x-icon"
/>

</head>


<style>
    /* ==========================
   RESET
========================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f7fb;
  color:#222;
  min-height:100vh;
  padding:25px;
}

/* ==========================
   CONTAINER
========================== */

.container{
  max-width:1200px;
  margin:auto;
}

/* ==========================
   HEADER
========================== */

.header{
  background:white;
  border-radius:20px;
  padding:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.header h1{
  font-size:28px;
  margin-bottom:8px;
}

.header p{
  color:#666;
}

.header button{
  border:none;
  background:#2563eb;
  color:white;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.header button:hover{
  transform:translateY(-2px);
}

/* ==========================
   PACIENTE
========================== */

.patient-card{
  background:white;
  border-radius:20px;
  padding:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.patient-info h2{
  margin-bottom:8px;
}

.patient-info p{
  color:#666;
}

.date-area{
  background:#eef4ff;
  padding:12px 18px;
  border-radius:12px;
  color:#2563eb;
  font-weight:bold;
}

/* ==========================
   ABAS
========================== */

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.tab-btn{
  border:none;
  padding:14px 22px;
  border-radius:12px;
  background:white;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.tab-btn:hover{
  transform:translateY(-2px);
}

.tab-btn.active{
  background:#2563eb;
  color:white;
}

/* ==========================
   CONTEÚDO DAS ABAS
========================== */

.tab-content{
  display:none;
  background:white;
  border-radius:20px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.tab-content.active{
  display:block;
}

.tab-content h3{
  margin-bottom:20px;
}

/* ==========================
   HUMOR
========================== */

.humor-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.humor-card{
  background:#f8fafc;
  border:2px solid transparent;
  border-radius:16px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
  font-weight:bold;
}

.humor-card:hover{
  border-color:#2563eb;
  transform:translateY(-3px);
}

.humor-card input{
  display:none;
}

/* ==========================
   FORMULÁRIOS
========================== */

.form-group{
  margin-bottom:20px;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

.form-group input,
.form-group select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
}

.form-group input:focus,
.form-group select:focus{
  outline:none;
  border-color:#2563eb;
}

/* ==========================
   OBSERVAÇÕES
========================== */

textarea{
  width:100%;
  min-height:220px;
  resize:vertical;
  border:1px solid #ddd;
  border-radius:15px;
  padding:15px;
  font-size:15px;
}

textarea:focus{
  outline:none;
  border-color:#2563eb;
}

/* ==========================
   RESUMO
========================== */

.summary-card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.summary-card h2{
  margin-bottom:20px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.summary-grid div{
  background:#f8fafc;
  padding:18px;
  border-radius:15px;
}

.summary-grid span{
  display:block;
  color:#666;
  margin-bottom:8px;
}

.summary-grid strong{
  font-size:18px;
}

/* ==========================
   PROGRESSO
========================== */

.progress-box{
  margin-top:15px;
}

.progress-box h3{
  margin-bottom:15px;
}

.progress-bar{
  width:100%;
  height:18px;
  background:#e5e7eb;
  border-radius:50px;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:linear-gradient(
    90deg,
    #2563eb,
    #60a5fa
  );
  transition:0.4s;
}

#progressoTexto{
  display:block;
  margin-top:10px;
  font-weight:bold;
  color:#2563eb;
}

/* ==========================
   BOTÃO SALVAR
========================== */

.save-btn{
  width:100%;
  margin-top:25px;
  border:none;
  background:#2563eb;
  color:white;
  padding:18px;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.save-btn:hover{
  transform:translateY(-2px);
}

.save-btn i{
  margin-right:8px;
}

/* ==========================
   RESPONSIVO TABLET
========================== */

@media(max-width:900px){

  .header{
    flex-direction:column;
    gap:20px;
    text-align:center;
  }

  .patient-card{
    flex-direction:column;
    gap:15px;
    text-align:center;
  }

}

/* ==========================
   RESPONSIVO MOBILE
========================== */

@media(max-width:600px){

  body{
    padding:15px;
  }

  .header h1{
    font-size:22px;
  }

  .tab-btn{
    width:100%;
  }

  .summary-grid{
    grid-template-columns:1fr;
  }

}
</style>

<body>

<div class="container">

    <!-- CABEÇALHO -->

    <div class="header">

        <div>
            <h1>Monitoramento Diário</h1>
            <p>
                Registre humor, sono e observações do paciente.
            </p>
        </div>

        <button onclick="voltar()">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar
        </button>

    </div>

    <!-- PACIENTE -->

    <div class="patient-card">

        <div class="patient-info">

            <h2 id="nomePaciente">
                Paciente
            </h2>

            <p id="diagnosticoPaciente">
                Diagnóstico
            </p>

        </div>

        <div class="date-area">

            <span id="dataAtual"></span>

        </div>

    </div>

    <!-- ABAS -->

    <div class="tabs">

        <button
        class="tab-btn active"
        onclick="abrirAba('humor')">

            😀 Humor

        </button>

        <button
        class="tab-btn"
        onclick="abrirAba('sono')">

            😴 Sono

        </button>

        <button
        class="tab-btn"
        onclick="abrirAba('observacoes')">

            📝 Observações

        </button>

    </div>

    <!-- ABA HUMOR -->

    <div
    id="humor"
    class="tab-content active">

        <h3>Como o paciente esteve hoje?</h3>

        <div class="humor-grid">

            <label class="humor-card">

                <input
                type="radio"
                name="humor"
                value="Feliz"
                onchange="atualizarResumo()">

                😀 Feliz

            </label>

            <label class="humor-card">

                <input
                type="radio"
                name="humor"
                value="Calmo"
                onchange="atualizarResumo()">

                🙂 Calmo

            </label>

            <label class="humor-card">

                <input
                type="radio"
                name="humor"
                value="Neutro"
                onchange="atualizarResumo()">

                😐 Neutro

            </label>

            <label class="humor-card">

                <input
                type="radio"
                name="humor"
                value="Ansioso"
                onchange="atualizarResumo()">

                😟 Ansioso

            </label>

            <label class="humor-card">

                <input
                type="radio"
                name="humor"
                value="Triste"
                onchange="atualizarResumo()">

                😢 Triste

            </label>

        </div>

    </div>

    <!-- ABA SONO -->

    <div
    id="sono"
    class="tab-content">

        <h3>Informações do Sono</h3>

        <div class="form-group">

            <label>

                Horas Dormidas

            </label>

            <input
            type="number"
            id="horasSono"
            min="0"
            max="24"
            onchange="atualizarResumo()">

        </div>

        <div class="form-group">

            <label>

                Qualidade do Sono

            </label>

            <select
            id="qualidadeSono">

                <option>
                    Excelente
                </option>

                <option>
                    Boa
                </option>

                <option>
                    Regular
                </option>

                <option>
                    Ruim
                </option>

            </select>

        </div>

    </div>

    <!-- ABA OBSERVAÇÕES -->

    <div
    id="observacoes"
    class="tab-content">

        <h3>Observações do Dia</h3>

        <textarea
        id="observacao"
        placeholder="Escreva observações sobre o comportamento, evolução ou dificuldades encontradas hoje...">
        </textarea>

    </div>

    <!-- RESUMO -->

    <div class="summary-card">

        <h2>

            📊 Resumo do Dia

        </h2>

        <div class="summary-grid">

            <div>

                <span>Humor</span>

                <strong id="humorResumo">
                    Não definido
                </strong>

            </div>

            <div>

                <span>Pontos Humor</span>

                <strong id="pontosHumor">
                    0
                </strong>

            </div>

            <div>

                <span>Horas Dormidas</span>

                <strong id="sonoResumo">
                    0
                </strong>

            </div>

            <div>

                <span>Pontos Sono</span>

                <strong id="pontosSono">
                    0
                </strong>

            </div>

        </div>

        <div class="progress-box">

            <h3>

                Progresso Gerado Hoje

            </h3>

            <div class="progress-bar">

                <div
                class="progress-fill"
                id="progressFill">
                </div>

            </div>

            <span id="progressoTexto">

                0%

            </span>

        </div>

        <button
        class="save-btn"
        onclick="salvarMonitoramento()">

            <i class="fa-solid fa-floppy-disk"></i>

            Salvar Registro

        </button>

    </div>

</div>




<script>

// =============================
// UTILIZADOR LOGADO (PADRÃO SISTEMA)
// =============================
const user = JSON.parse(localStorage.getItem("loggedUser"));

if (!user) {
  alert("Acesso negado");
  window.location.href = "login.html";
}

const emailPaciente = user.email;

// =============================
// DATA
// =============================
const hoje = new Date().toISOString().split("T")[0];
document.getElementById("dataAtual").innerText = hoje;

// =============================
// VARIÁVEIS
// =============================
let humorSelecionado = "Neutro";

// =============================
// ABAS
// =============================
function abrirAba(id, btn) {

  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));

  document.getElementById(id).classList.add("active");

  if (btn) btn.classList.add("active");
}

// =============================
// HUMOR
// =============================
document.querySelectorAll('input[name="humor"]').forEach(radio => {
  radio.addEventListener("change", () => {
    humorSelecionado = radio.value;
    atualizarResumo();
  });
});

// =============================
// INPUTS
// =============================
document.getElementById("horasSono").addEventListener("input", atualizarResumo);
document.getElementById("qualidadeSono").addEventListener("change", atualizarResumo);
document.getElementById("observacao").addEventListener("input", atualizarResumo);

// =============================
// CÁLCULO HUMOR
// =============================
function calcularHumor(humor) {
  switch (humor) {
    case "Feliz": return 15;
    case "Calmo": return 12;
    case "Neutro": return 8;
    case "Ansioso": return 4;
    case "Triste": return 0;
    default: return 8;
  }
}

// =============================
// CÁLCULO SONO
// =============================
function calcularSono(horas) {
  horas = Number(horas);

  if (horas >= 8) return 15;
  if (horas === 7) return 12;
  if (horas === 6) return 8;
  if (horas === 5) return 4;

  return 0;
}

// =============================
// RESUMO
// =============================
function atualizarResumo() {

  const horas = Number(document.getElementById("horasSono").value) || 0;

  const pontosHumor = calcularHumor(humorSelecionado);
  const pontosSono = calcularSono(horas);

  document.getElementById("humorResumo").innerText = humorSelecionado;
  document.getElementById("pontosHumor").innerText = pontosHumor;

  document.getElementById("sonoResumo").innerText = horas;
  document.getElementById("pontosSono").innerText = pontosSono;

  const total = pontosHumor + pontosSono;
  const progresso = Math.round((total / 30) * 100);

  document.getElementById("progressFill").style.width = progresso + "%";
  document.getElementById("progressoTexto").innerText = progresso + "%";
}

// =============================
// SALVAR MONITORAMENTO
// =============================
function salvarMonitoramento() {

  const horas = Number(document.getElementById("horasSono").value);
  const qualidade = document.getElementById("qualidadeSono").value;
  const observacao = document.getElementById("observacao").value;

  if (!horas && horas !== 0) {
    alert("Insere horas de sono");
    return;
  }

  const registro = {
    data: hoje,
    humor: humorSelecionado,
    sono: { horas, qualidade },
    progresso: document.getElementById("progressoTexto").innerText
  };

  // =============================
  // 🔥 GUARDAR MONITORAMENTO
  // =============================
  let keyMonitoramento = "monitoramento_" + emailPaciente;
  let dados = JSON.parse(localStorage.getItem(keyMonitoramento)) || [];

  dados.push(registro);

  localStorage.setItem(keyMonitoramento, JSON.stringify(dados));

  // =============================
  // 🔥 GUARDAR OBSERVAÇÃO (SEPARADO)
  // =============================
  if (observacao.trim() !== "") {

    let keyObs = "observacao_" + emailPaciente;
    let obs = JSON.parse(localStorage.getItem(keyObs)) || [];

    obs.push({
      data: hoje,
      texto: observacao
    });

    localStorage.setItem(keyObs, JSON.stringify(obs));
  }

  alert("Registo guardado com sucesso!");
}

// =============================
// VOLTAR
// =============================
function voltar() {
  window.location.href = "paciente.html";
}

// INIT
atualizarResumo();

</script>




</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Terapias - AbraçaMente</title>
<link rel="shortcut icon" href="image/Abracamente.png" type="image/x-icon">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#f8fafc;
  padding:20px;
}

/* HEADER */
.header{
  text-align:center;
  margin-bottom:25px;
}

.header h1{
  color:#2563eb;
}

.header p{
  color:#64748b;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  transition:0.3s;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 40px rgba(37,99,235,0.2);
}

.card h2{
  color:#2563eb;
  margin-bottom:10px;
}

.card p{
  color:#64748b;
}

/* brilho */
.card::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle, rgba(37,99,235,0.15), transparent 60%);
  opacity:0;
  transition:0.4s;
}

.card:hover::before{
  opacity:1;
}

/* PROGRESSO */
.progress{
  margin-top:12px;
  height:10px;
  background:#e5e7eb;
  border-radius:50px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#2563eb,#60a5fa);
  transition:0.4s;
}

/* BOTÃO */
button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
}

</style>

</head>

<body>

<div class="header">
  <h1>🧠 Terapias</h1>
  <p>Escolhe uma terapia para iniciar o teu progresso</p>
</div>

<div class="grid">

  <!-- FOCO -->
  <div class="card">
    <h2>🎯 Terapia do Foco</h2>
    <p>Treina concentração e atenção mental</p>

    <div class="progress">
      <div class="bar" id="focoBar"></div>
    </div>

    <button onclick="abrir('foco')">Iniciar</button>
  </div>

  <!-- RESPIRAÇÃO -->
  <div class="card">
    <h2>🌬️ Terapia da Respiração</h2>
    <p>Exercícios guiados de respiração</p>

    <div class="progress">
      <div class="bar" id="respBar"></div>
    </div>

    <button onclick="abrir('respiracao')">Iniciar</button>
  </div>

  <!-- ROTINA -->
  <div class="card">
    <h2>📅 Terapia da Rotina</h2>
    <p>Organização diária e hábitos saudáveis</p>

    <div class="progress">
      <div class="bar" id="rotinaBar"></div>
    </div>

    <button onclick="abrir('rotina')">Iniciar</button>
  </div>

</div>

<script>

// LOGIN CHECK
const user = JSON.parse(localStorage.getItem("loggedUser"));

if(!user){
  alert("Faz login primeiro");
  window.location.href="login.html";
}

const key = "terapia_" + user.email;

// PROGRESSO
let data = JSON.parse(localStorage.getItem(key)) || {
  foco:0,
  respiracao:0,
  rotina:0
};

function updateBars(){
  document.getElementById("focoBar").style.width = data.foco + "%";
  document.getElementById("respBar").style.width = data.respiracao + "%";
  document.getElementById("rotinaBar").style.width = data.rotina + "%";
}

updateBars();

// ABRIR TERAPIAS
function abrir(tipo){

  if(tipo === "foco"){
    window.location.href = "foco.html";
  }

  if(tipo === "respiracao"){
    window.location.href = "respiracao.html";
  }

  if(tipo === "rotina"){
    window.location.href = "rotina.html";
  }
}

</script>

</body>
</html>

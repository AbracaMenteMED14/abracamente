<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Paciente - Abracamente</title>
  <link rel="shortcut icon" href="image/Abracamente.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8fafc;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
    }

    .left {
      width: 25%;
      background: white;
      padding: 20px;
      border-right: 1px solid #e2e8f0;
    }

    .center {
      width: 50%;
      padding: 20px;
    }

    .right {
      width: 25%;
      background: white;
      padding: 20px;
      border-left: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .profile-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #2563eb;
    }

    .edit-btn {
      margin-top: 10px;
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .cards {
      display: grid;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      display: block;
      text-decoration: none;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: 0.3s;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .progress-card {
      margin-top: 15px;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 50px;
      overflow: hidden;
    }

    #globalBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#2563eb,#60a5fa);
      transition: 0.4s;
    }

    .right a {
      padding: 12px;
      background: #f1f5f9;
      border-radius: 10px;
      text-decoration: none;
      color: #2563eb;
    }

    .right a:hover {
      background: #2563eb;
      color: white;
    }

    @media(max-width:900px){
      .dashboard{flex-direction:column;}
      .left,.center,.right{width:100%;}
    }
  </style>
</head>

<body>

<div class="dashboard">

  <!-- ESQUERDA -->
  <div class="left">

    <div class="profile-card">

      <img id="preview" class="avatar">

      <input type="file" id="file" hidden>

      <button class="edit-btn" onclick="document.getElementById('file').click()">
        Editar foto
      </button>

      <h3 id="nome"></h3>
      <p id="email"></p>
      <p id="numero"></p>
      <p id="diagnostico"></p>

      <div class="progress-card">
        <h3>Progresso</h3>
        <div class="bar"><div id="globalBar"></div></div>
        <p id="globalText">0%</p>
      </div>

    </div>

  </div>

  <!-- CENTRO -->
  <div class="center">

    <h2>Área do Paciente</h2>

    <div class="cards">

      <a href="jogos.html" class="card">🎮 Jogos</a>
      <a href="terapia.html" class="card">🧘 Terapias</a>
      <a href="monitoramento.html" class="card">📊 Monitoramento</a>

    </div>

  </div>

  <!-- DIREITA -->
  <div class="right">
    <a href="comunidadepro.html">Comunidade</a>
    <a href="acompanhamento.html">Acompanhamento</a>
    <a href="consulta.html">Consulta</a>
    <a href="index.html">Sair</a>
  </div>

</div>

<script src="progresso.js"></script>

<script>
window.addEventListener("DOMContentLoaded", () => {

  let user = JSON.parse(localStorage.getItem("loggedUser"));
  if (!user) {
    alert("Acesso negado!");
    window.location.href = "login.html";
    return;
  }

  // PERFIL
  document.getElementById("nome").innerText = user.nome;
  document.getElementById("email").innerText = user.email;
  document.getElementById("numero").innerText = user.numero;
  document.getElementById("diagnostico").innerText = user.diagnostico;

  // FOTO (por usuário)
  let foto = localStorage.getItem("fotoPerfil_" + user.email);
  document.getElementById("preview").src = foto || "image/default.png";

  // PROGRESSO

let progresso = calcularProgresso(user.email);

document.getElementById("globalBar").style.width = progresso + "%";
document.getElementById("globalText").innerText = progresso + "%";

  // upload foto
  document.getElementById("file").addEventListener("change", loadPhoto);
});

// FOTO FUNCIONAL
function loadPhoto(event) {

  let file = event.target.files[0];
  if (!file) return;

  let reader = new FileReader();

  reader.onload = function () {

    let img = reader.result;

    let user = JSON.parse(localStorage.getItem("loggedUser"));
    if (!user) return;

    localStorage.setItem("fotoPerfil_" + user.email, img);

    document.getElementById("preview").src = img;
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>

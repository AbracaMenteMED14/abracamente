<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Profisssioanl - AbracaMente</title>
 
</head>

<style>
    /* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

/* BACKGROUND */
body {
  background: #f8fafc;
}

/* DASHBOARD */
.dashboard {
  display: flex;
  min-height: 100vh;
}

/* COLUNAS */
.left {
  width: 25%;
  background: white;
  padding: 20px;
  border-right: 1px solid #e2e8f0;
}

.center {
  width: 50%;
  padding: 20px;
}

.right {
  width: 25%;
  background: white;
  padding: 20px;
  border-left: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
}

/* PERFIL */
.profile-card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  animation: fadeIn 0.5s ease;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 3px solid #2563eb;
  object-fit: cover;
  margin-bottom: 10px;
  transition: 0.3s;
}

.avatar:hover {
  transform: scale(1.05);
}

.profile-card button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.profile-card button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(37,99,235,0.3);
}

/* TABELA */
table {
  width: 100%;
  border-collapse: collapse;
  animation: fadeIn 0.5s ease;
}

th {
  background: #2563eb;
  color: white;
  padding: 12px;
}

td {
  padding: 12px;
  border-bottom: 1px solid #e2e8f0;
}

tr:hover {
  background: #f1f5f9;
  transform: scale(1.01);
  transition: 0.2s;
}

/* LINKS */
.right a {
  padding: 12px;
  margin: 8px 0;
  text-decoration: none;
  color: #2563eb;
  background: #f8fafc;
  border-radius: 10px;
  transition: 0.3s;
}

.right a:hover {
  background: #2563eb;
  color: white;
  transform: translateX(5px);
}

/* ANIMAÇÃO */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

/* RESPONSIVO */
@media (max-width: 900px) {
  .dashboard {
    flex-direction: column;
  }

  .left, .center, .right {
    width: 100%;
  }
}
</style>


<body>

<div class="dashboard">

  <!-- 🔵 ESQUERDA - PERFIL -->
  <div class="left">

    <h3>Perfil Médico</h3>

    <input type="file" id="foto" accept="image/*" onchange="loadPhoto(event)">
    <img id="preview" class="avatar">

    <p id="nome"></p>
    <p id="email"></p>
    <p id="numero"></p>
    <p id="area"></p>

  </div>

  <!-- 🔵 CENTRO - TABELA -->
  <div class="center">

    <h2>Pacientes</h2>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Diagnóstico</th>
          <th>Progresso</th>
        </tr>
      </thead>

      <tbody id="tabelaPacientes"></tbody>
    </table>

  </div>

  <!-- 🔵 DIREITA - LINKS -->
  <div class="right">

    <a href="comunidade.html">Comunidade</a>
    <a href="agenda.html">Agenda</a>
    <a href="login.html">Sair</a>

  </div>

</div>

<script>

// 🔐 proteção
let user = JSON.parse(localStorage.getItem("loggedUser"));

if (!user || user.type !== "medico") {
    alert("Acesso negado!");
    window.location.href = "login.html";
}

// 👤 PERFIL
document.getElementById("nome").innerText = user.nome;
document.getElementById("email").innerText = user.email;
document.getElementById("numero").innerText = user.numero;
document.getElementById("area").innerText = user.area || "";

// 📸 FOTO PERFIL
function loadPhoto(event) {
    let file = event.target.files[0];
    let reader = new FileReader();

    reader.onload = function () {
        document.getElementById("preview").src = reader.result;
        localStorage.setItem("fotoPerfil", reader.result);
    };

    reader.readAsDataURL(file);
}

// carregar foto salva
document.getElementById("preview").src =
    localStorage.getItem("fotoPerfil") || "";

// 👨‍⚕️ PACIENTES
let users = JSON.parse(localStorage.getItem("users")) || [];

let pacientes = users.filter(u => u.type === "paciente");

let tabela = document.getElementById("tabelaPacientes");

pacientes.forEach(p => {

    tabela.innerHTML += `
        <tr>
          <td>${p.nome}</td>
          <td>${p.diagnostico}</td>
          <td>${p.progresso || "0%"}</td>
        </tr>
    `;
});    
</script>


</body>
</html>

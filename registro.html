<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Registo - AbraçaMente</title>

  <link rel="shortcut icon" href="image/Abracamente.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  
</head>

<body>

<div class="container">

  <h2>Criar Conta</h2>

  <select id="type" onchange="changeForm()">
    <option value="paciente">Paciente</option>
    <option value="medico">Profissional De Saúde</option>
  </select>

  <div id="form"></div>

  <button onclick="register()">Registar</button>

  Já tem Conta? <a href="login.html">Entrar</a>

</div>

<script>
    function changeForm() {
    let type = document.getElementById("type").value;
    let form = document.getElementById("form");

    if (type === "paciente") {
        form.innerHTML = `
            <input id="nome" placeholder="Nome">
            <input id="email" placeholder="Email">
            <input id="numero" placeholder="Número">
            <input id="password" placeholder="Palavra-passe" type="password">
            <input id="diagnostico" placeholder="Diagnóstico">
        `;
    } else {
        form.innerHTML = `
            <input id="nome" placeholder="Nome">
            <input id="email" placeholder="Email">
            <input id="numero" placeholder="Número">
            <input id="password" placeholder="Palavra-passe" type="password">
            <input id="area" placeholder="Área de atuação">
        `;
    }
}

changeForm(); // carregar inicial

function register() {
    let type = document.getElementById("type").value;

    let user = {
        id: Date.now(),
        type: type,
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        numero: document.getElementById("numero").value,
        password: document.getElementById("password").value
    };

    if (type === "paciente") {
        user.diagnostico = document.getElementById("diagnostico").value;
    } else {
        user.area = document.getElementById("area").value;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];
    users.push(user);

    localStorage.setItem("users", JSON.stringify(users));

    alert("Conta criada com sucesso!");

    window.location.href = "login.html";
}
</script>
</body>
</html>

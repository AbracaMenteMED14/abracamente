<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Jogo da Memória - Abracamente</title>
  <link rel="shortcut icon" href="image/Abracamente.png" type="image/x-icon">

  <style>
    body {
      font-family: Arial;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #2563eb;
    }
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(60px, 90px));
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}

    .card {
    aspect-ratio: 1/1;
      background: #2563eb;
      color: white;
      font-size: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: 0.3s;
    }

    .card.flipped {
      background: white;
      color: black;
      transform: rotateY(180deg);
    }

    .card.matched {
      background: #22c55e;
      color: white;
      cursor: default;
    }

    .info {
      margin-top: 15px;
      color: #0f172a;
    }

    @media (max-width: 600px) {

  .board {
    gap: 8px;
  }

  .card {
    width: 70px;
    height: 70px;
    font-size: 24px;
  }

}

@media (max-width: 400px) {

  .card {
    width: 60px;
    height: 60px;
    font-size: 20px;
  }

}
  </style>
</head>

<body>

<h1>🧠 Jogo da Memória</h1>

<div class="info" id="status">Encontra todos os pares 🍎🍌🍇</div>

<div class="board" id="board"></div>

<script>
const fruits = ["🍎","🍌","🍇","🍊","🍉","🍓","🍍","🥝"];
let cards = [...fruits, ...fruits];

cards.sort(() => 0.5 - Math.random());

let board = document.getElementById("board");

let firstCard = null;
let secondCard = null;
let lock = false;
let matchedCount = 0;

// criar tabuleiro
cards.forEach(emoji => {
  let card = document.createElement("div");
  card.classList.add("card");
  card.dataset.value = emoji;
  card.innerText = "";

  card.addEventListener("click", () => flipCard(card));

  board.appendChild(card);
});

function flipCard(card) {

  if (lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;

  card.classList.add("flipped");
  card.innerText = card.dataset.value;

  if (!firstCard) {
    firstCard = card;
    return;
  }

  secondCard = card;
  lock = true;

  checkMatch();
}

function checkMatch() {

  if (firstCard.dataset.value === secondCard.dataset.value) {

    firstCard.classList.add("matched");
    secondCard.classList.add("matched");

    matchedCount++;

    reset();

    if (matchedCount === 8) {
      finishGame();
    }

  } else {

    setTimeout(() => {
      firstCard.classList.remove("flipped");
      secondCard.classList.remove("flipped");

      firstCard.innerText = "";
      secondCard.innerText = "";

      reset();

    }, 800);
  }
}

function reset() {
  firstCard = null;
  secondCard = null;
  lock = false;
}

// 🎯 FINAL DO JOGO + SALVAR PROGRESSO
function finishGame() {

  alert("🎉 Parabéns! Completaste o jogo da memória (30%)");

  let user = JSON.parse(localStorage.getItem("loggedUser"));

  if (!user) return;

  let key = "jogos_" + user.email;

  let data = JSON.parse(localStorage.getItem(key)) || {};

  data.memoria = true;

  localStorage.setItem(key, JSON.stringify(data));

  setTimeout(() => {
    window.location.href = "jogos.html";
  }, 1000);
}
</script>

</body>
</html>

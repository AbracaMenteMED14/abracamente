<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quebra-Cabeça - Abracamente</title>
<link rel="shortcut icon" href="image/Abracamente.png" type="image/x-icon">


</head>


<style>
    body{
  font-family:Arial;
  background:#f8fafc;
  text-align:center;
  padding:20px;
}

h1{
  color:#2563eb;
}

#msg{
  margin:10px;
  color:#475569;
}

.game{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
}

/* TABULEIRO */
.board{
  display:grid;
  grid-template-columns:repeat(4,80px);
  grid-template-rows:repeat(3,80px);
  gap:5px;
}

.slot{
  width:80px;
  height:80px;
  border:2px dashed #cbd5e1;
  border-radius:8px;
}

/* PEÇAS */
.pieces{
  width:350px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
}

.piece{
  width:80px;
  height:80px;
  background-image:url("image/puzzle.jpg");
  background-size:320px 240px;
  border-radius:8px;
  cursor:grab;
  transition:0.2s;
}

.piece:active{
  cursor:grabbing;
  transform:scale(1.05);
}

/* RESPONSIVO */
@media(max-width:600px){
  .board, .piece{
    width:65px;
    height:65px;
  }

  .board{
    grid-template-columns:repeat(4,65px);
    grid-template-rows:repeat(3,65px);
  }

  .piece{
    background-size:260px 195px;
  }
}
</style>

<body>

<h1>🧩 Quebra-Cabeça</h1>
<p id="msg">Arrasta as peças para montar a imagem</p>

<div class="game">

  <div class="board" id="board"></div>

  <div class="pieces" id="pieces"></div>

</div>

<script>

const board = document.getElementById("board");
const piecesBox = document.getElementById("pieces");
const msg = document.getElementById("msg");

let total = 12;

// =========================
// CRIAR SLOT DO TABULEIRO
// =========================
for(let i=0;i<total;i++){

  let slot = document.createElement("div");
  slot.classList.add("slot");
  slot.dataset.index = i;

  slot.addEventListener("dragover", e=>{
    e.preventDefault();
  });

  slot.addEventListener("drop", e=>{
    e.preventDefault();

    let id = e.dataTransfer.getData("id");
    let piece = document.getElementById(id);

    // permitir mover de volta ou trocar
    if(slot.children.length > 0){

      piecesBox.appendChild(slot.children[0]);

    }

    slot.appendChild(piece);

    msg.innerText = "A montar...";

    checkWin();
  });

  board.appendChild(slot);
}

// =========================
// CRIAR PEÇAS EMBARALHADAS
// =========================
let indexes = [...Array(total).keys()];
indexes.sort(()=>Math.random()-0.5);

indexes.forEach(i=>{

  let piece = document.createElement("div");
  piece.classList.add("piece");
  piece.id = "p"+i;
  piece.draggable = true;
  piece.dataset.index = i;

  let x = (i % 4) * 80;
  let y = Math.floor(i / 4) * 80;

  piece.style.backgroundPosition = `-${x}px -${y}px`;

  piece.addEventListener("dragstart", e=>{
    e.dataTransfer.setData("id", piece.id);
  });

  piecesBox.appendChild(piece);
});

// =========================
// VERIFICAR VITÓRIA
// =========================
function checkWin(){

  let slots = document.querySelectorAll(".slot");
  let ok = true;

  slots.forEach(slot=>{

    if(slot.children.length === 0){
      ok = false;
      return;
    }

    let piece = slot.children[0];

    if(piece.dataset.index != slot.dataset.index){
      ok = false;
    }

  });

  if(ok){
    finish();
  }
}

// =========================
// FINAL DO JOGO
// =========================
function finish(){

  msg.innerText = "🎉 Parabéns! Puzzle completo (+40%)";

  let user = JSON.parse(localStorage.getItem("loggedUser"));

  if(user){

    let key = "jogos_" + user.email;

    let data = JSON.parse(localStorage.getItem(key)) || {};

    data.quebraCabeca = true;
    data.progressoQuebraCabeca = 40;

    localStorage.setItem(key, JSON.stringify(data));
  }

  setTimeout(()=>{
    window.location.href = "jogos.html";
  },1500);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Terapia do Foco - Abracamente</title>
<link rel="shortcut icon" href="image/Abracamente.png" type="image/x-icon">


</head>

<style>
    body{
  font-family:Arial;
  background:#f8fafc;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.box{
  background:white;
  width:90%;
  max-width:500px;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
  animation:fade 0.4s ease;
}

h2{
  color:#2563eb;
}

p{
  color:#64748b;
}

.option{
  background:#f1f5f9;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
}

.option:hover{
  transform:scale(1.02);
  background:#e2e8f0;
}

.correct{
  background:#22c55e !important;
  color:white;
}

.wrong{
  background:#ef4444 !important;
  color:white;
}

button{
  margin-top:15px;
  padding:12px 20px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
</style>

<body>

<div class="box" id="quiz">

  <h2>🧠 Terapia do Foco</h2>
  <p>Clica em iniciar para começares</p>

  <button onclick="startQuiz()">Iniciar</button>

</div>

<script>

const questions = [
  {
    q: "Qual destes é um animal?",
    options: ["🍎 Maçã", "🚗 Carro", "🐶 Cão", "📘 Livro"],
    answer: 2
  },
  {
    q: "Qual destes é uma cor?",
    options: ["🪑 Mesa", "🔵 Azul", "🐱 Gato", "👞 Sapato"],
    answer: 1
  },
  {
    q: "Qual usamos para escrever?",
    options: ["⚽ Bola", "🖊️ Caneta", "👟 Sapato", "📺 TV"],
    answer: 1
  },
  {
    q: "Qual é uma fruta?",
    options: ["🍞 Pão", "🍎 Maçã", "🪑 Cadeira", "🚗 Carro"],
    answer: 1
  },
  {
    q: "Qual serve para beber água?",
    options: ["🥤 Copo", "⚽ Bola", "📘 Livro", "🔑 Chave"],
    answer: 0
  }
];

let index = 0;
let score = 0;

// =========================
// USER LOGADO
// =========================
const user = JSON.parse(localStorage.getItem("loggedUser"));

if(!user){
  alert("Faz login primeiro");
  window.location.href = "login.html";
}

// =========================
// START
// =========================
function startQuiz(){
  renderQuestion();
}

// =========================
// RENDER
// =========================
function renderQuestion(){

  const q = questions[index];

  let html = `
    <h2>${q.q}</h2>
  `;

  q.options.forEach((opt, i) => {
    html += `
      <div class="option" onclick="selectAnswer(${i})">
        ${opt}
      </div>
    `;
  });

  document.getElementById("quiz").innerHTML = html;
}

// =========================
// RESPOSTA
// =========================
function selectAnswer(i){

  const q = questions[index];
  const options = document.querySelectorAll(".option");

  if(i === q.answer){
    options[i].classList.add("correct");
    score++;
  } else {
    options[i].classList.add("wrong");
    options[q.answer].classList.add("correct");
  }

  setTimeout(() => {

    index++;

    if(index < questions.length){
      renderQuestion();
    } else {
      finish();
    }

  }, 700);
}

// =========================
// FINAL + STORAGE
// =========================
function finish(){

  const percent = Math.round((score / questions.length) * 100);

  let key = "terapia_" + user.email;

  let data = JSON.parse(localStorage.getItem(key)) || {
    foco:0,
    respiracao:0,
    rotina:0,
    total:0
  };

  // 👇 FOCO VALE 30%
  if(score >= 3){

    data.foco = 30;

    data.total =
      data.foco +
      data.respiracao +
      data.rotina;

    localStorage.setItem(key, JSON.stringify(data));

    document.getElementById("quiz").innerHTML = `
      <h2>🎉 Terapia concluída!</h2>
      <p>+30% de progresso no Foco</p>

      <button onclick="window.location.href='terapia.html'">
        Voltar
      </button>
    `;

  } else {

    document.getElementById("quiz").innerHTML = `
      <h2>❌ Tenta novamente</h2>
      <p>Precisas de pelo menos 3 acertos</p>

      <button onclick="location.reload()">
        Repetir
      </button>
    `;
  }
}

</script>

</body>
</html>

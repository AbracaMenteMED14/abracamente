<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login - AbraçaMente</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="image/Abracamente.png" type="image/x-icon">
</head>
<body>

<div class="container">

  <h2>Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Palavra-passe">

  <button onclick="login()">Entrar</button>

  Não está registrado ainda? <a href="registro.html">Registrar</a>




Ao clicar em entrar, você está aceitando nossos <a href="termos e politicas.html">Termos de uso</a> e <a href="termos e politicas.html">Políticas de Privacidade</a>

</div>


<script>
    function login() {

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

  // 🔥 ADMIN MANUAL
if (email === "infoabracamente@gmail.com" && password === "Biologiamolecular") {

    const adminUser = {
        email: email,
        password: password,
        nome: "Admin",
        type: "admin"
    };

    localStorage.setItem("loggedUser", JSON.stringify(adminUser));
    window.location.href = "admin.html";
    return;
}

    // 🔎 buscar utilizadores registados
    let users = JSON.parse(localStorage.getItem("users")) || [];

    let user = users.find(u => u.email === email && u.password === password);

    if (!user) {
        alert("Email ou password incorretos!");
        return;
    }

    // guardar sessão
    localStorage.setItem("loggedUser", JSON.stringify(user));

    // 🎯 redirecionar por tipo
    if (user.type === "paciente") {
        localStorage.setItem("role", "paciente");
        window.location.href = "paciente.html";
    }

    else if (user.type === "medico") {
        localStorage.setItem("role", "medico");
        window.location.href = "profissional.html";
    }

}
</script>
</body>
</html>
